[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-survival"
version = "0.7.0"
description = "An extensible federated survival-analysis framework with model and protocol adapters"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["federated learning", "survival analysis", "model adapters", "reproducible research", "healthcare"]
authors = [
    {name = "Wenjun Wang", email = "amber930422@163.com"}
]
maintainers = [
    {name = "Wenjun Wang", email = "amber930422@163.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.22.0",
    "pandas>=1.5.0",
    "torch>=1.11.0",
    "scikit-learn>=1.1.0",
    "sklearn-pandas>=2.2.0",
    "lifelines>=0.27.0",
    "pycox>=0.2.3",
    "matplotlib>=3.5.0",
    "scipy>=1.9.0",
    "openpyxl>=3.1.0",
    "tqdm>=4.60.0",
    "torchtuples>=0.2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "build>=1.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "twine>=5.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/Amberwang12/federated-survival"
Documentation = "https://github.com/Amberwang12/federated-survival#readme"
Repository = "https://github.com/Amberwang12/federated-survival"
"Bug Tracker" = "https://github.com/Amberwang12/federated-survival/issues"

[project.scripts]
federated-survival = "federated_survival.cli:main"

[tool.setuptools.packages.find]
include = ["federated_survival*"]
namespaces = true

[tool.setuptools.package-data]
federated_survival = [
    "*.txt",
    "*.md",
    "examples/*.yaml",
    "examples/*.json",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313', 'py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | build
  | dist
)/
'''
