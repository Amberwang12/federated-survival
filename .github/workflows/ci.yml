name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      NUMBA_THREADING_LAYER: workqueue
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Run test suite
        run: python -m pytest
      - name: Verify public command
        run: federated-survival doctor
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata and README
        run: python -m twine check --strict dist/*

  quickstart:
    runs-on: ubuntu-latest
    env:
      NUMBA_THREADING_LAYER: workqueue
      NUMBA_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[dev]"
      - name: Run an audited package example
        run: federated-survival quickstart --rounds 1 --samples 120 --output results/ci-quickstart
      - uses: actions/upload-artifact@v5
        with:
          name: quickstart-artifacts
          path: results/ci-quickstart
